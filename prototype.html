<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Himmaparn Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Sarabun:wght@400;600&display=swap">
<style>
/* Layout: single dark game shell — top status bar, one active screen, bottom controls */
:root{
  --bg:#0f1410; --panel:#18211a; --panel2:#202c22; --line:#3a4a36; --fg:#e8e2cf; --dim:#a39c86;
  --gold:#d6a84a; --red:#d0563f; --blue:#5aa6d6; --green:#7fbf5a; --grey:#8a8a80; --yellow:#f0d060;
  --display:"Chakra Petch","Sarabun",sans-serif; --body:"Sarabun","Tahoma",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
*{box-sizing:border-box}
button{font-family:var(--body);font-size:14px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--gold)} button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button:disabled{opacity:.4;cursor:not-allowed} button.on{background:var(--gold);color:#1a1408;border-color:var(--gold)}
h1,h2,h3{font-family:var(--display);margin:4px 0 8px;text-wrap:balance} h2{font-size:20px;color:var(--gold)} h3{font-size:16px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.bar .grow{flex:1}
.meter{display:inline-block;width:90px;height:9px;background:#2a2a22;border-radius:5px;overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--green)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
/* Thai ornament border placeholder (กระหนก-like corner pattern) */
.orn{position:relative;border:2px solid var(--gold);border-radius:4px;padding:12px;
  background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(214,168,74,.06) 6px 12px)}
.orn::before,.orn::after{content:"❖";position:absolute;color:var(--gold);font-size:14px;top:-10px;left:8px;background:var(--bg);padding:0 3px}
.orn::after{left:auto;right:8px}
.grid{display:grid;gap:8px} .g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))} .g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.small{font-size:12.5px;color:var(--dim)} .gold{color:var(--gold)} .red{color:var(--red)} .blue{color:var(--blue)} .green{color:var(--green)}
table{border-collapse:collapse;width:100%;font-size:13px} td,th{border:1px solid var(--line);padding:3px 6px;text-align:left} th{background:var(--panel2)}
.tw{overflow-x:auto}
.portrait{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#5a4a30 0 22%,transparent 23%),radial-gradient(ellipse at 50% 95%,#5a4a30 0 45%,transparent 46%),#2b2418;
  border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:600;color:var(--gold);flex:none}
.npc{display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.artlabel{display:none;font-size:11px;background:#3b1f4a;color:#f3d8ff;border:1px dashed #c88ae8;padding:1px 4px;border-radius:3px;margin:2px 0}
body.art .artlabel{display:inline-block}
#view{width:100%;max-width:640px;aspect-ratio:4/3;display:block;border:2px solid var(--line);border-radius:6px;background:#000;image-rendering:auto}
.dun{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:8px}
@media (max-width:760px){.dun{grid-template-columns:1fr}}
#mini{width:224px;height:224px;max-width:100%;cursor:crosshair;border:1px solid var(--line);background:#111;touch-action:none}
#full{width:min(100%,520px);aspect-ratio:1/1;border:1px solid var(--line);background:#111;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px}
.pad button{height:44px;font-size:18px}
.party{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pm{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px;font-size:13px;min-width:0}
.pm.act{border-color:var(--gold)} .pm.dead{opacity:.45}
.enemies{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:170px;align-items:flex-end}
.ecard{width:150px;background:linear-gradient(#2a2216,#17130c);border:2px solid #6b5326;border-radius:6px;padding:6px;text-align:center;cursor:pointer;position:relative}
.ecard.sel{border-color:var(--yellow);box-shadow:0 0 10px rgba(240,208,96,.4)} .ecard.dead{opacity:.25;pointer-events:none}
.ecard.elite{border-color:var(--red)}
.sil{height:86px;display:grid;place-items:center}
.float{position:absolute;left:0;right:0;top:20px;font-family:var(--display);font-size:20px;font-weight:600;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 1px 2px #000}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
.log{height:130px;overflow:auto;font-size:12.5px;background:#0c100c;border:1px solid var(--line);padding:6px;border-radius:4px}
.cmds{display:flex;flex-wrap:wrap;gap:6px}
.hpbar{height:6px;background:#331;border-radius:3px;overflow:hidden;margin:2px 0} .hpbar i{display:block;height:100%;background:var(--red)}
.mpbar i{background:var(--blue)}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:11px;background:#333;margin-right:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay>.panel{max-width:620px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1a1408;padding:6px 12px;border-radius:4px;z-index:30;font-weight:600}
.sk{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line);font-size:13px}
.sk.lock{opacity:.45}
</style>

function makeChar(cls, lv){
  const c = CLS[cls], v = {};
  for (const k of G.stats) v[k] = +(c.base[k] * rnd(0.9, 1.1)).toFixed(1);
  const ch = { id:Math.random().toString(36).slice(2,8), cls, name:pick(NAMES[cls]), origin: cls==="beast" ? "สัตว์หิมพานต์ ("+pick(G.bloodlines).name+")" : pick(ORIG),
    lv:1, exp:1, base:v, ranks:{}, wpn:0, arm:0, hp:0, mp:0, st:{}, buffs:{}, rhythm:0 };
  ch.sp = C.SP_START; setLevel(ch, lv || 1); ch.hp = maxHP(ch); ch.mp = maxMP(ch); return ch;
}
function setLevel(ch, lv){ ch.lv = clamp(lv,1,C.LEVEL_CAP); ch.exp = ch.lv ** 3;
  const spent = Object.values(ch.ranks).reduce((a,b)=>a+b,0); ch.sp = C.SP_START + (ch.lv-1) - spent; }
function skillsOf(ch){ return CLS[ch.cls].skills; }
function rankOf(ch, name){ return ch.ranks[name] || 0; }
function passive(ch, k){ let tot=0; for (const s of skillsOf(ch)){ const f=FX[s.name]; const r=rankOf(ch,s.name);
  if (f && f.t==="pas" && f.k===k && r>0) tot += num(s.ranks[r-1][f.v]); } return tot; }
function rawStat(ch, k){ const c = CLS[ch.cls]; return ch.base[k] + c.growth[k] * (ch.lv - 1); }
function stat(ch, k){ let v = rawStat(ch,k);
  if (k==="STR") v *= 1 + passive(ch,"str")/100 + (ch.buffs.str? ch.buffs.str.v:0);
  if (k==="AGI") v *= 1 + passive(ch,"agi")/100 + (ch.buffs.agi? ch.buffs.agi.v:0);
  if (k==="TEC") v *= 1 + passive(ch,"tec")/100;
  if (k==="AGI" && S && S.inv["เข็มทิศเงิน"]) v += 3;
  return Math.round(v); }
function maxHP(ch){ return Math.round(rawStat(ch,"HP") * (1 + passive(ch,"hp")/100)); }
function maxMP(ch){ return Math.round(rawStat(ch,"MP") * (1 + passive(ch,"mp")/100)); }
function weaponATK(ch){ const c = CLS[ch.cls], b = G.weaponTier["1"][ch.wpn]; return b * c.weaponMult.atk * (1 + passive(ch,"atk")/100); }
function spellPow(ch){ const c = CLS[ch.cls], b = G.weaponTier["1"][ch.wpn]; return b * c.weaponMult.spell; }
function armorDEF(ch){ return G.armorTier["1"][ch.arm] * CLS[ch.cls].armorMult; }
function pdef(ch){ let d = armorDEF(ch) + stat(ch,"VIT")*2; d *= 1 + passive(ch,"def")/100 + (ch.buffs.def? ch.buffs.def.v:0); return d; }
function mdef(ch){ return armorDEF(ch)*0.5 + stat(ch,"TEC")*1.5; }
const alive = ch => ch.hp > 0;

/* ================================================================ TIME */
const hhmm = m => { const h = Math.floor(m/60)%24, mm = Math.floor(m%60); return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0"); };
const isNight = () => { const h = Math.floor(S.min/60)%24; return h>=18 || h<6; };
function addMinutes(m){
  S.min += m;
  while (S.min >= 24*60){ S.min -= 24*60; S.day++; onNewDay(); }
  if (S.day >= C.DAY_DEADLINE && S.min >= 6*60 && !S.chapterDone && S.screen!=="combat" && !bossForced){ bossForced = true; startBoss(true); }
}
let bossForced = false;
function onNewDay(){ if (S.day % 1 === 0) { S.candDay = 0; } if (S.map) S.map.gather.forEach(g => g.left = 3);
  if (S.day===24||S.day===28||S.day===30) toast(`หอบันทึก: เหลืออีก ${31-S.day} วันก่อนหมอกลง`); }
function sleep(){ const target = 6*60; let add = (24*60 - S.min) + target; if (S.min < target) add = target - S.min; addMinutes(add); }

function advice(c){ const keys=["STR","VIT","AGI","TEC","LUK"]; let hi=keys[0], lo=keys[0], rh=-9, rl=9;
  for (const k of keys){ const r = c.base[k]/CLS[c.cls].base[k]; if (r>rh){rh=r;hi=k} if (r<rl){rl=r;lo=k} }
  const word = {STR:"แรงดี",VIT:"ทนทาน",AGI:"ว่องไว",TEC:"หัวไว",LUK:"ดวงดี"}, weak = {STR:"แรงน้อย",VIT:"บอบบาง",AGI:"เชื่องช้า",TEC:"ไม่ค่อยรู้วิชา",LUK:"ดวงซวย"};
  return `นายทองอิน: "คนนี้${word[hi]} แต่${weak[lo]}"`; }
function healCost(){ return Math.ceil(S.roster.filter(alive).reduce((a,c)=>a+(maxHP(c)-c.hp)*0.1+(maxMP(c)-c.mp)*0.3,0)); }
function craft(id, slot){ const c = S.roster.find(x=>x.id===id); const need = slot==="wpn" ? {"งาโลโต":1,"ขนกิหมี":2} : {"งาโลโต":1,"หนังติณสีห์":2}; const g = slot==="wpn"?150:120;
  if (!Object.entries(need).every(([k,n])=>(S.mats[k]||0)>=n) || S.gold<g) return toast("วัตถุดิบหรือ Gold ไม่พอ");
  for (const [k,n] of Object.entries(need)) S.mats[k]-=n; S.gold -= g; c[slot] = 1; addMinutes(120); toast("นายช่างมั่น: …ดี"); npcPanel("smith"); }
function ensureQuests(){ if (S.questDay) return; S.questDay = 1;

function questReady(q){ return q.mat ? (S.mats[q.mat]||0)>=q.n : (S.kills[q.kill]||0)>=q.n; }

function canRank(c, s){ const tierLv = {1:1,2:10,3:25,4:40}; const max = s.tier===4?C.ULT_RANK_MAX:C.SKILL_RANK_MAX;
  if (c.sp<=0 || c.lv<tierLv[s.tier] || rankOf(c,s.name)>=max) return false;
  const m = /^(.+?) Rank (\d+)/.exec(s.prereq.replace(/^Lv\d+ \+ /,"")); if (m && s.prereq!=="-"){ const names = m[1].split(",").map(x=>x.trim()); if (!names.every(nm=>rankOf(c,nm)>=+m[2])) return false; }
  return true; }

/* ================================================================ MAP (data) */
// 20x20 cells. wallN[y][x] = wall on north edge of cell, wallW[y][x] = wall on west edge. rock[y][x] = solid.
function seeded(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function buildMap(){
  const N = 20, R = seeded(4231);
  const rock = Array.from({length:N},()=>Array(N).fill(false));
  [[6,6,3,3],[12,3,2,4],[3,13,4,2],[13,12,3,3]].forEach(([x,y,w,h])=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)rock[j][i]=true;});
  const wallN = Array.from({length:N+1},()=>Array(N).fill(true)), wallW = Array.from({length:N},()=>Array(N+1).fill(true));
  const seen = Array.from({length:N},()=>Array(N).fill(false));
  const stack = [[1,18]], vis = Array.from({length:N},()=>Array(N).fill(false)); vis[18][1] = true;
  const D = [[0,-1],[1,0],[0,1],[-1,0]];
  while (stack.length){ const [x,y] = stack[stack.length-1];
    const nb = D.map(([dx,dy],i)=>[x+dx,y+dy,i]).filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!vis[b][a]&&!rock[b][a]);
    if (!nb.length){ stack.pop(); continue; }
    const [a,b,i] = nb[Math.floor(R()*nb.length)]; openEdge(x,y,i); vis[b][a] = true; stack.push([a,b]); }
  function openEdge(x,y,d){ if (d===0) wallN[y][x]=false; if (d===2) wallN[y+1][x]=false; if (d===3) wallW[y][x]=false; if (d===1) wallW[y][x+1]=false; }
  for (let k=0;k<45;k++){ const x=1+Math.floor(R()*(N-2)), y=1+Math.floor(R()*(N-2)), d=Math.floor(R()*4); const [dx,dy]=D[d];
    if (!rock[y][x] && !rock[y+dy][x+dx]) openEdge(x,y,d); }
  // a small clearing near the start
  for (let y=15;y<18;y++) for (let x=1;x<4;x++){ if (y>15) wallN[y][x]=false; if (x>1) wallW[y][x]=false; }
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (rock[y][x]){ wallN[y][x]=wallN[y+1][x]=true; wallW[y][x]=wallW[y][x+1]=true; }
  const m = {N, rock, wallN, wallW, seen, inside:false, px:1, py:18, dir:0, start:[1,18],
    draw:{floor:Array.from({length:N},()=>Array(N).fill(0)), wN:Array.from({length:N+1},()=>Array(N).fill(false)), wW:Array.from({length:N},()=>Array(N+1).fill(false)), icon:{}, memo:{}},
    autoFloor:true, steps:0, nextEnc:0, encLeft:0, flags:{}};
  const dist = bfs(m, 1, 18); let far=[1,18], fd=0; for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (dist[y][x]>fd){fd=dist[y][x];far=[x,y];}
  m.boss = far; m.mist = [N-1, 9]; while (rock[m.mist[1]][m.mist[0]]) m.mist[1]++;
  m.jiro = [9, 2]; while (rock[m.jiro[1]][m.jiro[0]]) m.jiro[0]++;
  m.gather = [{x:4,y:10,left:3,kind:"เก็บ"},{x:15,y:7,left:3,kind:"ขุด"}].map(g=>{while(rock[g.y][g.x])g.x++;return g;});
  m.chests = [{x:17,y:17,open:false,item:"ยาหอม",n:2},{x:2,y:3,open:false,item:"ด้ายสายสิญจน์",n:1}].map(g=>{while(rock[g.y][g.x])g.x++;return g;});
  m.water = [10,15]; while (rock[m.water[1]][m.water[0]]) m.water[0]++;
  // elite patrol: shortest path between two mid-map cells, ping-pong

/* ---------------- pseudo-3D view (Etrian-style receding frames) */
function drawView(){

  const night = isNight();
  const sky = g.createLinearGradient(0,0,0,H/2); sky.addColorStop(0, night?"#05080a":"#2f4a28"); sky.addColorStop(1, night?"#0c1410":"#6e8f4a");
  g.fillStyle = sky; g.fillRect(0,0,W,H/2);
  const fl = g.createLinearGradient(0,H/2,0,H); fl.addColorStop(0, night?"#0d0c08":"#3d3420"); fl.addColorStop(1, night?"#1b1710":"#6a5634");
  g.fillStyle = fl; g.fillRect(0,H/2,W,H/2);
  // light shafts (day)
  if (!night){ g.globalAlpha=.08; g.fillStyle="#fff6c0"; for (let i=0;i<4;i++){ g.beginPath(); g.moveTo(80+i*150,0); g.lineTo(120+i*150,0); g.lineTo(60+i*150+90,H); g.lineTo(40+i*150+60,H); g.fill(); } g.globalAlpha=1; }

    const a = fr(d), b = fr(d+1);
    // left side
    if (!canMove(m,x,y,left)){ poly(g,[[a.l,a.t],[b.l,b.t],[b.l,b.b],[a.l,a.b]], leaf(d,1)); vines(g,a.l,a.t,b.l,b.b,d); }
    else { poly(g,[[a.l,b.t],[b.l,b.t],[b.l,b.b],[a.l,b.b]], leaf(d+1,.8)); }
    if (!canMove(m,x,y,right)){ poly(g,[[a.r,a.t],[b.r,b.t],[b.r,b.b],[a.r,a.b]], leaf(d,1)); vines(g,b.r,a.t,a.r,b.b,d); }
    else { poly(g,[[a.r,b.t],[b.r,b.t],[b.r,b.b],[a.r,b.b]], leaf(d+1,.8)); }

    if (!canMove(m,x,y,dir)){ poly(g,[[b.l,b.t],[b.r,b.t],[b.r,b.b],[b.l,b.b]], leaf(d+1,1.1)); vines(g,b.l,b.t,b.r,b.b,d+1); break; }

    const cx = W/2, cy = (b.b+a.b)/2, s = (b.r-b.l)/6;
    if (t==="ELITE"){ g.fillStyle = "rgba(10,6,4,.85)"; g.beginPath(); g.ellipse(cx, b.b - s*1.2, s*1.4, s*1.1, 0, 0, Math.PI*2); g.fill();
      g.fillStyle="#c33"; g.fillRect(cx-s*.5,b.b-s*1.6,s*.25,s*.15); g.fillRect(cx+s*.25,b.b-s*1.6,s*.25,s*.15);
      g.strokeStyle="#d0563f"; g.lineWidth=2; g.strokeRect(cx-s*1.6,b.b-s*2.5,s*3.2,s*2.6);
      if (S.art){ g.fillStyle="#f3d8ff"; g.font="13px Sarabun"; g.fillText("[Art: โลโต — สิงห์มีงวงและงาเล็ก (สัตว์ชั้นสูง)]", cx-s*1.6, b.b-s*2.7); } }
    else { g.font = `${Math.max(12, s*1.6)}px serif`; g.textAlign="center"; g.fillText(t, cx, cy); g.textAlign="left"; }
  }

  if (S.art){ g.fillStyle="#f3d8ff"; g.font="12px Sarabun"; g.fillText("[Art: ผนัง = ต้นไม้/พุ่มไม้ยักษ์ · พื้น = ดินป่า · ท้องฟ้า = เรือนยอดไม้ลอดแสง]", 10, H-10); }
}
function poly(g, pts, col){ g.fillStyle = col; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for (const p of pts.slice(1)) g.lineTo(p[0],p[1]); g.closePath(); g.fill();

function bindDraw(cv, cells, origin){

    const i = Math.floor(fx), j = Math.floor(fy), x = ox+i, y = oy+j, m = S.map; if (x<0||y<0||x>=m.N||y>=m.N) return;

      if (e===dy) m.draw.wN[y][x]=!m.draw.wN[y][x]; else if (e===1-dy) m.draw.wN[y+1][x]=!m.draw.wN[y+1][x];
      else if (e===dx) m.draw.wW[y][x]=!m.draw.wW[y][x]; else m.draw.wW[y][x+1]=!m.draw.wW[y][x+1]; }
    else if (mapTool.mode==="floor") m.draw.floor[y][x] = (ev.type==="pointerdown" && m.draw.floor[y][x]===mapTool.color) ? 0 : mapTool.color;
    else if (mapTool.mode==="icon") m.draw.icon[k] = m.draw.icon[k]===mapTool.icon ? undefined : mapTool.icon;
    else if (mapTool.mode==="memo"){ memoPrompt(x,y); return; }

    drawMini(); const f=$("#full"); if (f) drawMapCanvas(f, m.N, 0, 0, true); };

  cv.onpointermove = ev => { if (dragging) handler(ev); };

function resolveTurn(){
  const pc = partyChars(); const acts = [];

function playerHit(c, e, mult, o={}){

  if (Math.random() < Math.max(0, miss)){ log(`${c.name} พลาด!`); floatAt($("#ec"+B.es.indexOf(e)),"MISS","#aaa"); return 0; }

  let d = base * mult * em * (crit ? Math.min(2.5, 1.5 + stat(c,"AGI")/100) : 1) * rnd(.9,1.1) * 100 / (100 + def);
  if (e.st.sleep){ d *= 1.5; delete e.st.sleep; }

  floatAt($("#ec"+B.es.indexOf(e)), d + (crit?"!":""), col);
  log(`${c.name} → ${e.name} <b style="color:${col}">${d}</b>${crit?" (คริติคอล)":""}${em>1?" ได้ผลมาก!":em<1?" ไม่ค่อยได้ผล":""} [${ELEM_TH[el]}]`);

  return d;
}
function partyBuff(k){ return B.pbuff && B.pbuff[k] ? B.pbuff[k].v : 0; }

  if (Math.random()<ch){ const dur = {poison:3,stun:1,sleep:3,bind:2,para:3,blind:3}[st]; e.st[st] = Object.assign({t: (e.boss? Math.max(1,dur-1): dur)+1}, extra||{}); log(`  ${e.name} ติด ${stTh(st)}`); return true; } return false; }
function doPlayer(c, cmd){

}
function parseSkill(sk){ const [name, eff, cdS, chS] = sk; const mul = /(\d+)%/.exec(eff); const hits = /×\s*(\d)/.exec(eff);

    mag:/Magic/.test(eff), summon:/เรียก/.test(eff), status:(/(Poison|Bind|Stun|Sleep|Blind|Paralyze)\s*(\d+)?%?/.exec(eff)||[]).slice(1),
    cd:num(cdS)||0, chance:(num(chS)||100)/100, passive:/Passive/.test(eff), steal:/ขโมย/.test(eff), heal:/ฮีล|ฟื้น HP/.test(eff), buffDef:/DEF.*\+|ตั้งหลัก|ตั้งการ์ด|DEF ตัวเอง/.test(eff)&&!/ลด DEF/.test(eff), debuffDef:/DEF เป้าหมาย|DEF ปาร์ตี้ −/.test(eff), atkDown:/ATK ปาร์ตี้ −/.test(eff)}; }
function doEnemy(e){
  if (e.st.stun||e.st.sleep){ log(`${e.name} ขยับไม่ได้`); return; } if (e.st.para && Math.random()<.5){ log(`${e.name} ตัวชา`); return; }

  if (e.beh==="Coward" && e.hp<e.mhp*.5 && Math.random()<.5){ e.fled=true; log(`${e.name} หนีไป!`); return; }
  if (e.stole && !e.st.bind){ e.fled=true; log(`${e.name} บินหนีไปพร้อม${e.stole}!`); return; }

function enemyAttack(e, sk, live){
  const targets = sk.all ? live : [pickTarget(e, live)];
  for (const t of targets){ for (let h=0; h<(sk.hits||1); h++){ if (!alive(t)) break;
    let eva = C.EVASION_BASE + stat(t,"AGI")*0.005 + passive(t,"eva")/100 - e.acc/100 + (e.st.blind?0.30:0); eva = clamp(eva, 0, C.EVASION_CAP);
    if (Math.random()<eva){ log(`${t.name} หลบ ${e.name}`); continue; }

    const def = sk.mag ? mdef(victim) : pdef(victim);
    let d = e.atk * (sk.mult||1) * (1 - (e.st.atkDown?e.st.atkDown.v:0)) * rnd(.9,1.1) * 100/(100+def);

    if (victim.hp - d <= 0 && passive(victim,"survive") && !victim.survived && Math.random()<passive(victim,"survive")/100){ d = victim.hp-1; victim.survived=true; log(`<b class="green">${victim.name} ใจทหารหาญ! รอดด้วย HP 1</b>`); }
    victim.hp = Math.max(0, victim.hp - d);
    if (victim.st.sleep) delete victim.st.sleep;
    log(`${e.name} ${sk.name||'โจมตี'} → ${victim.name} <span class="red">${d}</span>${victim!==t?" (รับแทน "+t.name+")":""}${victim.def?" (ตั้งรับ)":""}`);
    if (victim.cls==="boxer"){ if (Math.random()<passive(victim,"rhyhit")/100) victim.rhythm=Math.min(5,victim.rhythm+1); }
    if (victim.def && passive(victim,"counter") && Math.random()<passive(victim,"counter")/100){ log(`${victim.name} ไม้ปัดสวน!`); playerHit(victim, e, .8); }
    if (sk.status && sk.status[0] && alive(victim)){ const map={Poison:"poison",Bind:"bind",Stun:"stun",Sleep:"sleep",Blind:"blind",Paralyze:"para"}; const st=map[sk.status[0]]; const ch=(+sk.status[1]||60)/100*(1-Math.min(.5,stat(victim,"VIT")/400));
      if (victim.ward>0){ victim.ward--; log(`  ยันต์กันคุณป้องกัน ${stTh(st)}`); } else if (Math.random()<ch){ victim.st[st]={t:{poison:3,stun:1,sleep:3,bind:2,para:3,blind:3}[st]+1}; log(`  ${victim.name} ติด ${stTh(st)}`); if (st==="stun"||st==="sleep") victim.rhythm=0; } }
    if (!alive(victim)) log(`<b class="red">${victim.name} ล้มลง!</b>`);
  } }
  renderCombatLite();
}
function pickTarget(e, live){ if (B.provoke && alive(B.provoke.who)) return B.provoke.who;

function onEnemyDie(e, by){ if (e.dead) return; e.dead = true; e.hp = 0; log(`<b>${e.name} ถูกกำจัด</b>`);

function condDrop(e){ const c = (e.mon.rare||[])[1]||""; if (/ธาตุไฟ/.test(c)) return e.lastEl==="fire"; if (/ธาตุน้ำ/.test(c)) return e.lastEl==="water"; if (/ธาตุลม/.test(c)) return e.lastEl==="wind";

    h = `<h2>ชนะ!</h2><p>EXP +${exp} · Gold +${gold}</p><p>ดรอป: ${Object.entries(drops).map(([k,v])=>k+" ×"+v).join(", ")||"-"}</p>${ups.length?`<p class="gold"><b>Level UP!</b> ${ups.join(", ")} (+1 SP)</p>`:''}`;
    if (B.opt.boss){ const bonus = B.opt.early ? (31-S.day)*50 : 0; S.gold += bonus; S.chapterDone = true; addMinutes(30); overlay(""); return go("end"); }

  addMinutes(C.FIGHT_HOURS*60); S.screen="dungeon"; resetEnc();
  overlay(h + `<div class="row"><button id="cls">ไปต่อ</button></div>`); $("#cls").onclick=()=>{ overlay(""); renderDungeon(); };
}
function gameOver(){ paused = true; overlay(`<h2 class="red">Game Over</h2><p>คณะเดินทางสิ้นชีพในป่าหิมพานต์…</p><div class="row"><button id="ld">โหลดเซฟล่าสุด (ศาลาพระ)</button></div>`);
  $("#ld").onclick = () => { overlay(""); doLoad(); }; }
function renderEnd(){ $("#screen").innerHTML = `<div class="panel orn"><h2>จบ Chapter 1 — ${esc(CH.name)}</h2><p>หมอกลงแล้วจางหาย เจ้าป่าถูกขับไล่ คณะยกค่ายตามลำน้ำเข้าไปลึกขึ้น…</p>
  <p class="small">วันที่ ${S.day} · Gold ${S.gold} · แผนที่ ${mapCompletion()}% · ล้มศัตรู ${Object.values(S.kills).reduce((a,b)=>a+b,0)} ตัว</p>${art("CG ปิด Chapter: คณะเดินขบวนตามลำน้ำ มองเห็นหมอกด้านหลัง")}
  <p>Chapter 2: ลุ่มน้ำปัญจมหานที — ยังไม่อยู่ใน Prototype</p><button id="again">เริ่มใหม่</button></div>`; $("#again").onclick=()=>{ S=newState(); bossForced=false; go("title"); }; }

/* ================================================================ SAVE */
let SAVE = null;
function doSave(silent){ SAVE = JSON.stringify(S); try { localStorage.setItem("himmaparn_proto_save", SAVE); } catch(e){} if (!silent) toast("บันทึกเกมแล้ว"); }
function doLoad(){ let s = SAVE; try { s = s || localStorage.getItem("himmaparn_proto_save"); } catch(e){} if (!s){ S = newState(); return go("title"); }
  S = JSON.parse(s); S.map.inside=false; bossForced=false; paused=false; document.body.classList.toggle("art", S.art); go("camp"); }

/* ================================================================ DEBUG */
function debugPanel(){ overlay(`<h2>Debug (สำหรับทีม)</h2><div class="row">
  <button id="d1">+1 Lv ปาร์ตี้</button><button id="d5">+5 Lv ปาร์ตี้</button><button id="dg">+500 Gold</button><button id="dt">+6 ชม.</button><button id="dd">ไปวันที่ 30</button>
  <button id="dm">เปิดแผนที่ทั้งหมด</button><button id="df">วาดแผนที่ให้ครบ (ทดสอบ %)</button><button id="dh">Hunger เต็ม</button><button id="dmat">+วัตถุดิบคราฟ</button><button id="db">ปลดล็อกสัตว์อสูร</button><button id="dmi">ภารกิจหลัก +1</button></div>
  <p class="small">ตัวเลขทั้งหมดมาจาก himmaparn_data.json (สร้างจาก GDD v2) · 1 ชม. ในเกม = ${C.SEC_PER_HOUR} วินาทีขณะสำรวจ</p>${closeBtn}`); bindClose();
  const on=(id,fn)=>{$(id).onclick=()=>{fn();topbar();toast("ok");};};
  on("#d1",()=>partyChars().forEach(c=>{setLevel(c,c.lv+1);c.hp=maxHP(c);c.mp=maxMP(c);})); on("#d5",()=>partyChars().forEach(c=>{setLevel(c,c.lv+5);c.hp=maxHP(c);c.mp=maxMP(c);}));
  on("#dg",()=>S.gold+=500); on("#dt",()=>addMinutes(360)); on("#dd",()=>{S.day=30;});
  on("#dm",()=>{ if(S.map) S.map.seen.forEach(r=>r.fill(true)); });
  on("#df",()=>{ const m=S.map; if(!m)return; for(let y=0;y<m.N;y++)for(let x=0;x<m.N;x++){ if(m.rock[y][x])continue; m.seen[y][x]=true; m.draw.floor[y][x]=m.draw.floor[y][x]||1; } for(let y=0;y<=m.N;y++)for(let x=0;x<m.N;x++) m.draw.wN[y][x]=m.wallN[y][x]; for(let y=0;y<m.N;y++)for(let x=0;x<=m.N;x++) m.draw.wW[y][x]=m.wallW[y][x]; });
  on("#dh",()=>S.hunger=C.MAX_HUNGER); on("#dmat",()=>{ ["งาโลโต","ขนกิหมี","หนังติณสีห์","เนื้อทิศากร","สมุนไพรป่า"].forEach(k=>S.mats[k]=(S.mats[k]||0)+3); });
  on("#db",()=>{S.beastUnlocked=true;S.candDay=0;}); on("#dmi",()=>{ if(S.mission<3) S.mission++; });
}

/* ================================================================ LOOP & INPUT */
function loop(t){ const dt = lastT ? (t-lastT)/1000 : 0; lastT = t;
  if (S && S.screen==="dungeon" && !paused && !$("#ov").innerHTML){ const before = Math.floor(S.min);
    addMinutes(dt * 60 / C.SEC_PER_HOUR); if (Math.floor(S.min)!==before && Math.floor(S.min)%5===0) topbar(); }
  requestAnimationFrame(loop); }
document.addEventListener("keydown", ev => { if (!S) return; if (ev.target.tagName==="INPUT") return;
  const k = ev.key.toLowerCase(); const map = {arrowup:"w",arrowdown:"s",arrowleft:"a",arrowright:"d"};
  if (k==="m" && S.screen==="dungeon"){ if (fullOpen){ fullOpen=false; paused=false; overlay(""); renderDungeon(); } else openFullMap(); return; }
  if (k==="escape"){ if ($("#ov").innerHTML){ if (fullOpen){ fullOpen=false; paused=false; } overlay(""); render(); } else if (S.screen==="dungeon"||S.screen==="camp") go("party"); return; }
  if ((k===" "||k==="enter") && S.screen==="dungeon" && !$("#ov").innerHTML){ ev.preventDefault(); act(); return; }
  if (S.screen==="dungeon" && !$("#ov").innerHTML){ const kk = map[k]||k; if ("wasdqe".includes(kk) && kk.length===1){ ev.preventDefault(); key(kk); } } });

S = newState(); render(); requestAnimationFrame(loop);
</script>
